name: Check

# ตรวจทุก push ไม่ใช่เฉพาะตอนขึ้น production — จะได้รู้ตั้งแต่ commit ลง dev
# ไม่ใช่ตอนที่ของขึ้นเว็บให้ผู้เล่นเห็นแล้ว
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      # ข้อมูลเกมไม่ตรงกันจะไม่ทำให้ build พัง แต่ผู้เล่นจะเจอของที่คราฟไม่ได้หรือเควสต์ที่เปิดแล้วว่างเปล่า
      - name: ตรวจข้อมูลเกม
        run: npm run check

      # ตรรกะล้วนที่คำนวณผิดแล้วผู้เล่นไม่มีทางรู้ตัว (เช่นหยิบเต๋าให้ผิดชุด) — เทียบกับการไล่ลองทุกแบบ
      - name: ทดสอบตรรกะ
        run: npm test

      - name: Build
        run: npm run build
